name: Feature request
description: Propose a scoped change with verifiable outcomes.
title: "[Feature]: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Problem and desired outcome
      description: What should change, and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable results would make this complete?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and non-goals
      description: Include behavior that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and verification
      description: Link observations and describe how to check the result.
    validations:
      required: false
